[pytest]
# Scope collection to tests/ and keep it out of the large ignored trees.
#
# Without testpaths, a bare `pytest` from the repository root walks work/,
# tmp/, and originals/. A leftover Wine prefix under tmp/ contains
# dosdevices/z: -> /, so collection follows that symlink out of the repository
# and does not terminate. `make test` already scopes to tests/; this makes a
# bare `pytest` behave the same way.
testpaths = tests
# Two tracks of the historical R2 runtime tests (August 2026) are opt-in.
# R2q (the user dropped it on 2026-09-27) took about four hours per run and
# about 1.5 GB of /tmp per test. R2p (paused) pins host identities: on 2026-10-12, 151 of its
# tests failed on them (125 after a restart renumbered the Wine preloader's
# device, 13 on an updated git, 13 on audio-server checks), 7 on a frozen copy
# of anm.py and 5 on other host-dependent checks. R2c..R2o pass and stay in the
# default run (about 17 minutes under load). A bare `pytest`, `make test`,
# `make check` and CI skip R2p and R2q; naming the files runs them:
#     pytest tests/test_r2p*.py tests/test_r2q*.py
# The switch lives here because R2q froze tests/conftest.py and R2p pins the
# Makefile; this file is pinned by neither. See Vault Decision Log 2026-10-12.
addopts = --ignore-glob=tests/test_r2p*.py --ignore-glob=tests/test_r2q*.py
norecursedirs =
    .git
    .venv
    dynamic
    originals
    media
    reimplementation/build
    static
    tmp
    tools
    work
